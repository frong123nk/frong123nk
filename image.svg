<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .track { fill: none; stroke: #30363d; stroke-width: 2; }
    .snake {
      fill: none;
      stroke: #39d353;
      stroke-width: 8;
      stroke-linecap: round;
    }
    .tail3 { stroke-dasharray: 90 310; opacity: .2;  animation: c3 4s linear infinite; }
    .tail2 { stroke-dasharray: 60 340; opacity: .45; animation: c2 4s linear infinite; }
    .tail1 { stroke-dasharray: 35 365; opacity: .75; animation: c1 4s linear infinite; }
    .head  { stroke-dasharray: 12 388; stroke: #7ee787; stroke-width: 10;
             animation: c0 4s linear infinite; }

    @keyframes c3 { from { stroke-dashoffset: 90; } to { stroke-dashoffset: -310; } }
    @keyframes c2 { from { stroke-dashoffset: 60; } to { stroke-dashoffset: -340; } }
    @keyframes c1 { from { stroke-dashoffset: 35; } to { stroke-dashoffset: -365; } }
    @keyframes c0 { from { stroke-dashoffset: 12; } to { stroke-dashoffset: -388; } }
  </style>

  <rect class="snake tail3" x="50" y="50" width="400" height="400" rx="12" pathLength="400"/>
  <rect class="snake tail2" x="50" y="50" width="400" height="400" rx="12" pathLength="400"/>
  <rect class="snake tail1" x="50" y="50" width="400" height="400" rx="12" pathLength="400"/>
  <rect class="snake head"  x="50" y="50" width="400" height="400" rx="12" pathLength="400"/>
</svg>
